spring.application.name=outpass-service

server.port=8081

# Database
# spring.datasource.url=jdbc:mysql://localhost:3306/outpass_db
# spring.datasource.url=jdbc:mysql://mysql:3306/outpass_db?allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url= jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=system
spring.datasource.password=Admin#123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.OracleDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
jwt.secret = p|}yR?-#mON21{-V<fxj$R//]?j0>.wkeoD(B#OG$(R
security.qr-secret=6hKvPsRSc+e7Ehkvt44ahqkU5f9ntYfAs2XdTU8d+QE=

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/outpass-service/v3/api-docs
springdoc.swagger-ui.config-url=/outpass-service/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true

# Logging
logging.file.name=logs/outpass-service.log

# Log levels
logging.level.root=INFO
logging.level.com.outpass.outpass_service=DEBUG

# Rolling policy
logging.logback.rollingpolicy.file-name-pattern=logs/outpass-service.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.clean-history-on-start=false